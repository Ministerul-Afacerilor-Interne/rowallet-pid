name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-specs:
    name: Lint Markdown & Validate Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install cbor2 pyyaml requests markdownlint-cli2

      - name: Lint Markdown Files
        run: |
          markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Validate Embedded JSON & CBOR Test Vectors
        run: |
          python -c "
          import re, json, glob, sys

          has_error = False
          for filepath in glob.glob('*.md'):
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()

              # Extrage toate blocurile de cod JSON
              json_blocks = re.findall(r'\`\`\`json\n(.*?)\n\`\`\`', content, re.DOTALL)
              for idx, block in enumerate(json_blocks):
                  # Sare peste blocurile ce conțin placeholder tags explicite (ex: <credential-issuer>)
                  if '<' in block and '>' in block:
                      continue
                  try:
                      json.loads(block)
                  except json.JSONDecodeError as err:
                      print(f'::error file={filepath}::JSON Syntax Error in block {idx+1}: {err}')
                      has_error = True

          if has_error:
              sys.exit(1)
          print('All static JSON payloads are syntactically valid.')
          "
